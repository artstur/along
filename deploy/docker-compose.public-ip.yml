# Apply last, after docker-compose.yml and docker-compose.tier2.yml.
# nginx is the sole public listener. Only edge and Host mount the socket volume.
services:
  netns:
    ports: !override []
  host:
    environment:
      ALONG_AGENT_PROXY_SOCKET: /run/along-proxy/host.sock
    volumes:
      - along-proxy:/run/along-proxy
    healthcheck:
      test: ["CMD","node","-e","require('node:http').get({socketPath:'/run/along-proxy/host.sock',path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
  edge:
    image: nginx:stable-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "${ALONG_EDGE_BIND_IPV4:-0.0.0.0}:80:80"
      - "${ALONG_EDGE_BIND_IPV4:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ALONG_EDGE_DIR:-../../edge}/webroot:/var/www/along-acme:ro
      - ${ALONG_EDGE_DIR:-../../edge}/tls/config:/etc/nginx/along-tls/config
      - ${ALONG_EDGE_DIR:-../../edge}/tls/releases:/etc/nginx/along-tls/releases:ro
      - along-proxy:/run/along-proxy:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "KILL", "NET_BIND_SERVICE", "SETGID", "SETUID"]
    mem_limit: 128m
    pids_limit: 32
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  acme:
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: ["acme"]
    networks: [along-acme]
    volumes:
      - ${ALONG_EDGE_DIR:-../../edge}/acme:/var/along-acme
      - ${ALONG_EDGE_DIR:-../../edge}/webroot:/var/www/along-acme
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
networks:
  along-acme:
volumes:
  along-proxy:
