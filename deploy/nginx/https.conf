server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/along-tls/releases/@ALONG_TLS_RELEASE@/fullchain.pem;
    ssl_certificate_key /etc/nginx/along-tls/releases/@ALONG_TLS_RELEASE@/privkey.pem;

    limit_conn along_per_ip 24;
    limit_conn along_total 64;
    client_max_body_size 3m;

    location / {
        proxy_pass http://unix:/run/along-proxy/host.sock;
        proxy_set_header X-Along-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 125s;
    }
}
