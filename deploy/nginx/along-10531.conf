# Along 云端入口（TCP 10531）：iPhone / 浏览器连 https://8.155.140.214:10531
#
# 为什么 TLS 在这一层终结：
#   Host 的云端证书校验器（along/host/tls-material.mjs:182-188）要求**根证书直接签叶证书**
#   且证书链逐级可验、链尾自签。Let's Encrypt 的 IP 证书链是
#   「叶 ← LE YE2 ← ISRG Root YE ← ISRG Root X2」，根并不直接签叶，塞进 Host 必被拒启。
#   所以内外分两层证书：对外用系统原生信任的 LE IP 证书（这里），对内 Host 用私 CA 自签叶证书
#   （data/host/tls/releases/<serial>/），nginx 反代时关闭校验（proxy_ssl_verify off）。
#
# 为什么不用 443：443 的安全组未放行，且 14443 已被 multica 占用；10531 由使用者放行。
#
# 已知边界（单用户自用可接受）：Host 记录客户端来源 IP 用的是 socket 地址，不读
# X-Forwarded-For，所以经这一层后它看到的来源是 127.0.0.1 —— /pair 的失败分桶因此是全局的。
server {
    listen 10531 ssl;
    listen [::]:10531 ssl;
    server_name 8.155.140.214;

    ssl_certificate     /etc/letsencrypt/live/8.155.140.214/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.155.140.214/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 3m;

    location / {
        proxy_pass https://127.0.0.1:4176;
        proxy_ssl_verify off;            # 对内是私 CA 自签叶证书（Host 的 cloud TLS 材料）
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
