# DSH Super Agent 面板对外入口（TCP 10530, TLS only）
#
# 1) 同源闸门：dsh-superagent 的管理 API 硬性要求 Host 属于 loopback authority
#    （src/app/http.ts: sameOrigin() 只接受 127.0.0.1:3082 / localhost:3082），
#    所以这里把 Host 与 Origin 改写回容器内的 loopback authority。
# 2) TLS：复用 certbot 短周期 IP 证书（SAN 含 8.155.140.214），
#    续期由 /etc/cron.d/le-renew + deploy-hook 自动换证书并 reload nginx。
# 3) 日志脱敏：请求 URI 里的 ?token=... 不落盘。

map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

# 抹掉 URL 里的 token，避免它留在 access.log
map $request_uri $dsh_safe_uri {
    default                                                        $request_uri;
    '~*^(.*?)token=[^&\s]*(.*)$'                                  '$1token=REDACTED$2';
}
map $http_referer $dsh_safe_referer {
    default                                                        $http_referer;
    '~*^(.*?)token=[^&\s]*(.*)$'                                  '$1token=REDACTED$2';
}

log_format dsh_safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $dsh_safe_uri $server_protocol" $status $body_bytes_sent '
                    '"$dsh_safe_referer" "$http_user_agent"';

server {
    listen 10530 ssl;
    listen [::]:10530 ssl;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/nginx/tls/multica.crt;
    ssl_certificate_key /etc/nginx/tls/multica.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dsh_ssl:1m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/dsh-panel.access.log dsh_safe;

    location / {
        # 宿主机 127.0.0.1:3083 -> 锚点容器命名空间内的跳板 0.0.0.0:3083 -> DSH 127.0.0.1:3082
        # （跳板见 along/deploy/netns-proxy.mjs；DSH 绑回环，宿主与外部容器都够不着）
        proxy_pass http://127.0.0.1:3083;
        proxy_http_version 1.1;

        proxy_set_header Host 127.0.0.1:3082;
        proxy_set_header Origin http://127.0.0.1:3082;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;


        # 面板用 SSE 推流，必须关缓冲并放长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
