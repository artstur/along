user nginx;
worker_processes 1;
worker_shutdown_timeout 125s;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 15s;

    limit_conn_zone $binary_remote_addr zone=along_per_ip:1m;
    limit_conn_zone $server_name zone=along_total:1m;
    limit_conn_status 429;

    server {
        listen 80 default_server;
        server_name _;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/along-acme;
            default_type text/plain;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }

    # Bootstrap uses an explicit empty config. During renewal a missing
    # config must fail the reload so the running HTTPS worker stays in place.
    include /etc/nginx/along-tls/config/active.conf;
}
