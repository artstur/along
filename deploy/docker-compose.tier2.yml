# Tier 2 叠加文件：常驻 Super Agent + 新链路开关（docs/cloud-deploy-multi-user.md §3.5，验证项 V-1）。
#
# 用法（§6.4 第 8 步）：
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tier2.yml --profile tier2 up -d
#
# 为什么用叠加文件而不是改主 compose：
#   - 主 compose 是 Tier 1 的**默认形态**（ALONG_EVENT_INGEST=off、新链路 503、runner 在场）。
#     Tier 2 的开关（EVENT_INGEST=on、桥接凭证）与它相反，两种形态不该写在同一份文件里
#     ——否则「回退」只能靠改文件再改回来（易漏、易错、审计不清）。
#   - 桥接凭证是 compose **file secret**：宿主文件缺失会让 `up` 直接失败（不是启动后报错）。
#     若主 compose 就声明它，没部署桥接凭证的 Tier 1 部署连 `up` 都跑不了。
#   - 叠加文件让两种形态各自可审计：`docker compose ... config` 的输出就是当次形态的完整事实。
#
# 相对路径基准与主 compose 相同：project directory = deploy/（§3.1），
# 所以 ../../data 与 ../../secrets 解析到 /opt/along/{data,secrets}（§6.4 第 1/3 步布局）。
#
# ---- 开启前的准备（§6.4 第 3 步的安全写入形态）----
#
#   install -m 600 /dev/null /opt/along/secrets/bridge-token
#   read -rs TOKEN; printf '%s\n' "$TOKEN" > /opt/along/secrets/bridge-token   # 32 字节 hex
#
# 凭证本体只落盘，不进环境变量、不进镜像层、不进日志（§3.3/§3.7）。
# 权限必须是 0600：host/along-bridge.mjs 的 readBridgeToken 与 Super Agent 的
# bridgeTokenOf 都按 0600 校验，权限过宽等同未配置（fail-closed）。
services:
  # ---- 共享网络命名空间的锚点容器（审查 P1-3）----
  #
  # Super Agent 硬性要求 webserver.host === '127.0.0.1'
  # （along-superagent 的 src/along/api.ts 与 src/app/http.ts 都检查这一条），
  # 所以它只能监听回环；host 与 superagent 必须共享同一个网络命名空间。
  #
  # 命名空间不能由 host 提供：挂在 host 命名空间上的 superagent 在 **host 单独重建**时
  # 会留在旧命名空间里，新 host 访问 127.0.0.1:3082 得到 ECONNREFUSED（隔离栈实测复现）。
  # 所以命名空间由这个与 host、superagent 都无关的第三方容器持有：
  # Host 与 Super Agent 可独立重建。更换锚点 ID 时用 tier2-stack.sh 一起重建三者。
  #
  # 它只持有一个命名空间：不监听端口、不挂卷、不读任何数据，跑一个空转进程即可。
  netns:
    image: node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    container_name: along-netns
    command: ["node","-e","setInterval(()=>{},1<<30)"]
    # 宿主机到 4176 的映射声明在这里：加入他人命名空间的容器**不能**自己发布端口
    # （docker 报 "conflicting options: port publishing and the container type network mode"），
    # 而命名空间是共享的——映射进的是同一个命名空间，host 的监听照样能被访问。
    ports: ["443:4176"]
    profiles: ["tier2"]
    restart: unless-stopped
  host:
    # 端口发布移到锚点容器（上面）：host 加入他人命名空间后不能自己发布端口。
    ports: !override []
    network_mode: "service:netns"
    depends_on:
      netns:
        condition: service_started
        # 传播 Compose 的显式 restart。容器 ID 变化由 tier2-stack.sh 的重建步骤处理。
        restart: true
    environment:
      # 新链路开关（§3.5）：on = /events、/sync、/sync/ack、/notifications/* 生效；
      # 旧 DSH 分支（/super-agent/goals|tasks）改答 409「已切换新链路」。
      # 回退时先停 superagent 和 netns，再去掉叠加文件重建 host（§6.5）。
      ALONG_EVENT_INGEST: "on"
      # 常驻 Super Agent 的回环地址。默认值就是它，这里显式写出是为了让叠加后的
      # `compose config` 自证形态（管理面仅本机可达：superagent 不发布任何端口）。
      ALONG_SUPERAGENT_URL: http://127.0.0.1:3082
      # 桥接凭证：与 superagent 读的是**同一份**宿主文件（../../secrets/bridge-token）。
      # 两侧各挂到 /run/secrets/bridge-token，内容同一份。
      ALONG_BRIDGE_TOKEN_FILE: /run/secrets/bridge-token
    secrets:
      - bridge-token
  superagent:
    # 与 host 共享同一个命名空间（锚点提供的），3082 不对外发布端口。
    network_mode: "service:netns"
    depends_on:
      netns:
        condition: service_started
        restart: true
    # 模型密钥（审查 P1-4）：长驻服务要真跑模型回合，就必须拿得到模型凭证。
    # 凭证本体只经 file secret 落盘（§3.3/§3.7），由启动脚本读出并注入进程环境，
    # 不进 compose 的 environment、不进镜像层、不进日志。
    secrets:
      - bridge-token
      - model-credentials
secrets:
  bridge-token:
    file: ../../secrets/bridge-token
  # 模型密钥：与 Tier 1 的 runner 共用同一份宿主文件（§6.4 第 3 步布局）。
  # 长驻服务与一次性 runner 用的是同一个 DeepSeek 凭证。
  model-credentials:
    file: ../../secrets/model-credentials
