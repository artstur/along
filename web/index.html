<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Bug#5：App 内置页面不允许双指捏合整体缩放。
       只有 along:// 的内置页面锁缩放，网页版本仍可缩放；独立内容页用自己的 viewport，不受影响。
       锁必须在首次布局前生效，所以放在 head 里就地改写 viewport，不等模块脚本。 -->
  <script>
    if (location.protocol === 'along:') {
      document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
    }
  </script>
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="Along 目标工作台：切换目标，查看进度与动态任务。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Along">
  <title>Along · 目标工作台</title>
  <link rel="icon" type="image/png" href="./app-icon.png?v=109">
  <link rel="apple-touch-icon" href="./app-icon.png?v=109">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=109">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <script type="module" src="./app.mjs?v=109"></script>
</body>
</html>
